name: Fetch GPU pricing daily
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests boto3 openpyxl
      - name: Fetch GPU pricing
        run: python fetch_gpu_pricing.py
        env:
          GCP_API_KEY: ${{ secrets.GCP_API_KEY }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
      - name: Fetch inference API pricing
        run: python fetch_inference_pricing.py
        env:
          GCP_API_KEY: ${{ secrets.GCP_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
      - name: Update price history
        run: python update_history.py
      - name: Tag operating system
        run: python os_overlay.py gpu_pricing.json
      - name: Extract Neysa SKUs
        run: python extract_neysa_skus.py Velocis_Pricing_Sheet.xlsx neysa_skus.json
      - name: Match competitors
        run: python match_competitors.py --neysa neysa_skus.json --competitors gpu_pricing.json --out Neysa_Competitor_SKU_Match.xlsx
      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.githu
